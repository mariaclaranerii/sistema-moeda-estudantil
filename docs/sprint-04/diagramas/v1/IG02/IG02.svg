			<text x="112" y="367.25" style="font-family: ArialU; font-size: 11px;fill: rgb(12%,20%,28%); stroke:none;" transform="translate(0,734) scale(1,-1)">VISÃO DE COMPLEMENTAÇÃO, NÃO IMPLEMENTADA. A decisão escolhe uma das duas interações conforme o evento; não impõe execução concorrente. DS12 e DS13 deverão ser integrados após</text>
			<text x="112" y="352.25" style="font-family: ArialU; font-size: 11px;fill: rgb(12%,20%,28%); stroke:none;" transform="translate(0,704) scale(1,-1)">confirmação da transação. As mensagens dos dois destinatários usam o mesmo código de DS11. Falha de e-mail não deve gerar novo débito, transferência ou código. A política de repetição e o adaptador de</text>
			<text x="112" y="337.25" style="font-family: ArialU; font-size: 11px;fill: rgb(12%,20%,28%); stroke:none;" transform="translate(0,674) scale(1,-1)">envio ainda são decisões de implementação. O autocadastro de aluno e empresa descrito no enunciado continua divergente do acesso restrito ao professor; resolver essa regra antes de alterar DS02 e DS04.</text>
			<text x="35" y="77.25" style="font-family: ArialU; font-size: 11px;fill: rgb(32%,39%,47%); stroke:none;" transform="translate(0,154) scale(1,-1)">Notação: nó inicial, nó final, decisão/merge, fluxo de controle e InteractionUse com aba ref.</text>
