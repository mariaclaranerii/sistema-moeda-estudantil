name: Publicar imagens dos diagramas Sprint 03
on:
  push:
    branches: [sprint-03-final]
    paths:
      - .github/workflows/publicar-imagens-sprint03.yml
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar conversor SVG para PNG
        run: python -m pip install cairosvg
      - name: Restaurar diagramas e gerar PNGs
        shell: bash
        env:
          SVG_COMPRESSOS: '{"componentes.svg":"","modelo-er.svg":""}'
        run: |
          python - <<'PY'
          import base64, json, zlib
          from pathlib import Path
          import cairosvg
          pasta = Path('docs/sprint-03/diagramas/v2')
          originais = json.loads(__import__('os').environ['SVG_COMPRESSOS'])
          for arquivo, conteudo in originais.items():
              destino = pasta / arquivo
              destino.write_bytes(zlib.decompress(base64.b64decode(conteudo)))
          resolucoes = {
              'classes': (3120, 2664),
              'componentes': (4508, 1200),
              'modelo-er': (3481, 3407),
          }
          for nome, (largura, altura) in resolucoes.items():
              cairosvg.svg2png(url=str(pasta / (nome + '.svg')), write_to=str(pasta / (nome + '.png')),
                               output_width=largura, output_height=altura)
              print(f'{nome}.png publicado')
          PY
      - name: Versionar PNG e SVG no GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/sprint-03/diagramas/v2/*.png docs/sprint-03/diagramas/v2/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(sprint-03): adicionar imagens dos tres diagramas [skip ci]"
          git push origin HEAD:sprint-03-final
