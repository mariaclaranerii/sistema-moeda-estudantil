<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${modo == 'novo'} ? 'Novo aluno' : 'Editar aluno')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="shell page narrow-page">
    <div class="page-heading">
        <a class="back-link" th:href="${modo == 'novo'} ? @{/painel} : @{/alunos}">← Voltar</a>
        <span class="eyebrow" th:text="${modo == 'novo'} ? 'Novo cadastro' : 'Atualização cadastral'">Cadastro</span>
        <h1 th:text="${modo == 'novo'} ? 'Cadastrar aluno' : 'Editar aluno'">Cadastrar aluno</h1>
        <p>Preencha os dados obrigatórios. A senha é armazenada de forma protegida.</p>
    </div>

    <form class="form-card" th:object="${alunoForm}"
          th:action="${modo == 'novo'} ? @{/alunos} : @{/alunos/{id}(id=${alunoId})}" method="post" novalidate>
        <div class="form-errors" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}">Revise os dados.</p>
        </div>

        <fieldset>
            <legend>Dados pessoais</legend>
            <div class="form-grid">
                <label class="field span-2">Nome completo
                    <input type="text" th:field="*{nome}" autocomplete="name" required>
                    <small class="field-error" th:errors="*{nome}"></small>
                </label>
                <label class="field">E-mail
                    <input type="email" th:field="*{email}" autocomplete="email" required>
                    <small class="field-error" th:errors="*{email}"></small>
                </label>
                <label class="field">CPF
                    <input type="text" th:field="*{cpf}" inputmode="numeric" placeholder="000.000.000-00" required>
                    <small class="field-error" th:errors="*{cpf}"></small>
                </label>
                <label class="field">RG
                    <input type="text" th:field="*{rg}" required>
                    <small class="field-error" th:errors="*{rg}"></small>
                </label>
                <label class="field">Endereço
                    <input type="text" th:field="*{endereco}" autocomplete="street-address" required>
                    <small class="field-error" th:errors="*{endereco}"></small>
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Vínculo acadêmico</legend>
            <div class="form-grid">
                <label class="field">Curso
                    <input type="text" th:field="*{curso}" required>
                    <small class="field-error" th:errors="*{curso}"></small>
                </label>
                <label class="field">Instituição de ensino
                    <select th:field="*{instituicaoId}" required>
                        <option value="">Selecione</option>
                        <option th:each="instituicao : ${instituicoes}" th:value="${instituicao.id}" th:text="${instituicao.nome}"></option>
                    </select>
                    <small class="field-error" th:errors="*{instituicaoId}"></small>
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Credenciais</legend>
            <div class="form-grid">
                <label class="field">Login
                    <input type="text" th:field="*{login}" autocomplete="username" required>
                    <small class="field-error" th:errors="*{login}"></small>
                </label>
                <label class="field">Senha <span th:if="${modo == 'editar'}">(deixe em branco para manter)</span>
                    <input type="password" th:field="*{senha}" autocomplete="new-password" minlength="8" th:required="${modo == 'novo'}">
                    <small class="field-error" th:errors="*{senha}"></small>
                </label>
            </div>
        </fieldset>

        <div class="form-actions">
            <a class="button secondary" th:href="${modo == 'novo'} ? @{/painel} : @{/alunos/{id}(id=${alunoId})}">Cancelar</a>
            <button class="button primary" type="submit" th:text="${modo == 'novo'} ? 'Cadastrar aluno' : 'Salvar alterações'">Salvar</button>
        </div>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
