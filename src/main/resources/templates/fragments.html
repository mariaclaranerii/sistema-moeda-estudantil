<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Moeda Estudantil'">Moeda Estudantil</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="site-header" th:fragment="header">
    <div class="shell header-content">
        <a class="brand" th:href="@{/}" aria-label="Página inicial">
            <span class="brand-mark" aria-hidden="true">M</span>
            <span><strong>Moeda</strong><small>Estudantil</small></span>
        </a>
        <nav class="header-nav" aria-label="Navegação principal">
            <th:block th:if="${cabecalho.autenticado}">
                <span class="header-role" th:text="${cabecalho.perfil}">Meu acesso</span>
                <a th:href="@{/painel}">Meu painel</a>
                <a th:if="${cabecalho.perfil == 'Professor'}" th:href="@{/alunos/novo}">Cadastrar aluno</a>
                <a th:if="${cabecalho.perfil == 'Professor'}" th:href="@{/empresas/nova}">Cadastrar empresa</a>
                <a th:href="@{/perfil}">Meu perfil</a>
                <form class="header-logout-form" th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="header-logout-button" type="submit">Sair da conta</button>
                </form>
            </th:block>
            <th:block th:unless="${cabecalho.autenticado}">
                <a th:href="@{/login}">Entrar</a>
                <a th:href="@{/alunos/novo}">Cadastrar aluno</a>
                <a th:href="@{/empresas/nova}">Cadastrar empresa</a>
            </th:block>
        </nav>
    </div>
</header>
<footer th:fragment="footer">
    <div class="shell footer-content">
        <span>PUC Minas · Projeto de Software</span>
        <span>Sprint 03</span>
    </div>
</footer>
</body>
</html>
