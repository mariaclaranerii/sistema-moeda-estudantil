<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Editar vantagem')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="shell page narrow-page">
  <div class="page-heading">
    <a class="back-link" th:href="@{/painel}">← Voltar ao meu painel</a>
    <span class="eyebrow">Empresa parceira</span>
    <h1>Editar vantagem</h1>
    <p>Atualize as informações da vantagem. A situação ativa/inativa é controlada no estoque.</p>
  </div>
  <div class="notice" th:if="${erro}" th:text="${erro}"></div>
  <form class="form-card" th:action="@{/painel/vantagens/{id}/editar(id=${vantagem.id})}" method="post">
    <div class="form-grid">
      <label class="field span-2">Título
        <input name="titulo" type="text" maxlength="160" required th:value="${vantagem.titulo}">
      </label>
      <label class="field">Custo em moedas
        <input name="custo" type="number" min="1" step="1" required th:value="${vantagem.custoMoedas}">
      </label>
      <label class="field span-2">Descrição
        <textarea name="descricao" rows="4" maxlength="1000" required
                  th:text="${vantagem.descricao}" style="display:block;width:100%;padding:.7rem;margin-top:.5rem"></textarea>
      </label>
      <label class="field span-2">URL HTTPS da foto
        <input name="fotoReferencia" type="url" pattern="https://.*" maxlength="1000" required
               th:value="${vantagem.fotoReferencia}">
      </label>
    </div>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="form-actions" style="margin-top:1.5rem">
      <a class="button secondary" th:href="@{/painel}">Cancelar</a>
      <button class="button primary" type="submit">Salvar alterações</button>
    </div>
  </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
