<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Empresas parceiras')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="shell page">
    <div class="page-heading heading-actions">
        <div>
            <span class="eyebrow">Cadastros</span>
            <h1>Empresas cadastradas</h1>
            <p>Relação de empresas parceiras, incluindo cadastros inativos.</p>
        </div>
        <a class="button primary" th:href="@{/empresas/nova}">Nova empresa</a>
    </div>

    <div class="notice success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="empty-state" th:if="${#lists.isEmpty(empresas)}">
        <span>ME</span>
        <h2>Nenhuma empresa cadastrada</h2>
        <p>Comece adicionando a primeira parceira.</p>
        <a class="button primary" th:href="@{/empresas/nova}">Cadastrar empresa</a>
    </div>
    <div class="table-wrap" th:unless="${#lists.isEmpty(empresas)}">
        <table>
            <thead><tr><th>Empresa</th><th>Situação</th></tr></thead>
            <tbody>
            <tr th:each="empresa : ${empresas}" th:classappend="${!empresa.ativo} ? 'muted-row'">
                <td><strong th:text="${empresa.nome}">Empresa</strong><small th:text="${empresa.email}">email</small></td>
                <td><span class="status" th:classappend="${empresa.ativo} ? 'active' : 'inactive'" th:text="${empresa.ativo} ? 'Ativa' : 'Inativa'">Ativa</span></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
