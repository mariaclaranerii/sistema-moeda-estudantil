spring:
  application:
    name: moeda-estudantil
  datasource:
    url: jdbc:h2:file:./data/moeda-estudantil;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: false
  mail:
    # Brevo SMTP: configure apenas as credenciais da conta em variáveis de ambiente.
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${EMAIL_FROM:}
    intervalo-ms: 60000

server:
  error:
    include-message: never
