spring:
  application:
    name: moeda-estudantil
  datasource:
    url: jdbc:h2:file:./data/moeda-estudantil;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: false
app:
  aluno:
    # Uso local: senha temporária compartilhada. Não usar em produção.
    senha-inicial: ${ALUNO_SENHA_INICIAL:Aluno@2026!}

server:
  error:
    include-message: never
