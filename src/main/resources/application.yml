spring:
  application:
    name: moeda-estudantil
  datasource:
    url: jdbc:h2:file:./data/moeda-estudantil;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  error:
    include-message: never
